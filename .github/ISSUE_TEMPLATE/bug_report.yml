name: "\U0001F41E Bug Report"
description: Report something that doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below as accurately as possible.

  - type: textarea
    id: description
    attributes:
      label: "\U0001F9E9 Bug Description"
      description: A clear and concise description of what the issue is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "\U0001F4CB Steps to Reproduce"
      description: Describe the exact steps to reproduce the issue.
      placeholder: |
        1. Start WiiFin U on [a Wii U with a TV / the GamePad alone / Cemu]
        2. Go to menu: ...
        3. Click on: ...
        4. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "\U0001F4FA Expected Behavior"
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "\U0001F4F7 Screenshots or Video (optional)"
      description: If you have a screenshot or video of the bug, attach it here.

  - type: dropdown
    id: platform
    attributes:
      label: "\U0001F3AE Platform"
      options:
        - Wii U with a TV
        - Wii U, the GamePad alone
        - Cemu (emulator)
    validations:
      required: true

  - type: input
    id: wii_model
    attributes:
      label: Console model / Emulator version
      placeholder: "e.g. Wii U 32 GB, firmware 5.5.6, Aroma / Cemu 2.6"

  - type: input
    id: version
    attributes:
      label: WiiFin U Version / Commit
      placeholder: "e.g. 0.1.0, or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: controller
    attributes:
      label: Controls
      options:
        - GamePad (buttons)
        - GamePad (touch screen)
        - Pro Controller
        - Wii Remote / Classic Controller


  - type: textarea
    id: log
    attributes:
      label: "\U0001F4DD Log"
      description: "Attach `sd:/wiiu/apps/WiiFinU/wiifinu.log` from the SD card (and `wiifinu.prev.log` if WiiFin U was started again after the bug). It hides addresses, tokens and user ids: it can be shared as it is."
